name: validate

on: [push, pull_request]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Package checks (version sync, pattern numbering, word budget)
        run: python scripts/validate-package.py
      - name: Rhythm metrics self-check
        run: python evals/test_rhythm_metrics.py
